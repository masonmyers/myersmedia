<!DOCTYPE HTML>
<html>
	<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Leadership Team</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Using the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom style to manage the width of each member card */
        .leader-card {
            flex-basis: calc(33.333% - 2rem); /* 3 columns with gap */
        }
        @media (max-width: 1024px) {
            .leader-card {
                flex-basis: calc(50% - 2rem); /* 2 columns on medium screens */
            }
        }
        @media (max-width: 640px) {
            .leader-card {
                flex-basis: 100%; /* 1 column on small screens */
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-6 py-12 md:py-20">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">Leadership</h1>
            <p class="text-lg text-gray-600 mt-2 max-w-2xl mx-auto">The talented team of visionaries guiding Myers Media to new heights.</p>
        </div>
        <div class="flex flex-wrap justify-center gap-8 md:gap-12">

            <!-- Member 1 -->
            <div class="text-center group leader-card">
                <a href="#" class="block">
                    <div class="relative inline-block">
                        <img 
                            src="https://placehold.co/400x400/a3a3a3/ffffff?text=Leader" 
                            alt="Photo of Jane Doe" 
                            class="w-40 h-40 md:w-48 md:h-48 rounded-full object-cover mx-auto shadow-lg group-hover:shadow-xl transition-shadow duration-300 ease-in-out transform group-hover:scale-105"
                            onerror="this.onerror=null;this.src='https://placehold.co/400x400/a3a3a3/ffffff?text=Error';">
                    </div>
                </a>
                <div class="mt-4">
                    <h3 class="text-xl font-semibold text-gray-800">Mason Myers</h3>
                    <p class="text-gray-500">Founder</p>
                </div>
            </div>
            <!-- End Member -->

            <!-- Member 2 -->
            <div class="text-center group leader-card">
                <a href="#" class="block">
                    <div class="relative inline-block">
                        <img 
                            src="https://placehold.co/400x400/404040/ffffff?text=Leader" 
                            alt="Photo of John Smith" 
                            class="w-40 h-40 md:w-48 md:h-48 rounded-full object-cover mx-auto shadow-lg group-hover:shadow-xl transition-shadow duration-300 ease-in-out transform group-hover:scale-105"
                            onerror="this.onerror=null;this.src='https://placehold.co/400x400/a3a3a3/ffffff?text=Error';">
                    </div>
                </a>
                <div class="mt-4">
                    <h3 class="text-xl font-semibold text-gray-800">Joel Myers</h3>
                    <p class="text-gray-500">Chief Legal Officer</p>
                </div>
            </div>
            <!-- End Member -->
            
        </div>

    </div>

			<!-- Footer -->
				<footer id="footer">
					<ul class="icons">
						<li><a href="#" class="icon brands alt fa-twitter"><span class="label">Twitter</span></a></li>
						<li><a href="#" class="icon brands alt fa-facebook-f"><span class="label">Facebook</span></a></li>
						<li><a href="#" class="icon brands alt fa-linkedin-in"><span class="label">LinkedIn</span></a></li>
						<li><a href="#" class="icon brands alt fa-instagram"><span class="label">Instagram</span></a></li>
					</ul>
					<ul class="copyright">
						<li>Myers Media LLC</li><li>Atlanta, GA</a></li>
					</ul>
				</footer>

		</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.scrolly.min.js"></script>
			<script src="assets/js/jquery.dropotron.min.js"></script>
			<script src="assets/js/jquery.scrollex.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

	</body>

</html>
